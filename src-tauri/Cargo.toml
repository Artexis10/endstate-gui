[package]
name = "autosuite-gui"
version = "0.1.0"
description = "Autosuite GUI - Desktop application for Autosuite"
authors = ["Substrate Systems"]
edition = "2021"

[lib]
name = "autosuite_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
