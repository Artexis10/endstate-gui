[workspace]
# The dev bridge was extracted out of the Tauri process into a standalone
# binary that links NONE of the native GUI stack (tao/wry/webview2-com) — the
# layer responsible for the intermittent 0xc0000374 heap corruption. Shared
# engine logic lives in engine-core; the standalone server is endstate-dev-bridge.
members = ["engine-core", "dev-bridge"]

[package]
name = "endstate-gui"
version = "2.19.2"
description = "Endstate GUI - Desktop application for Endstate"
authors = ["Substrate Systems"]
edition = "2021"

[lib]
name = "endstate_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
endstate-engine-core = { path = "engine-core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
which = "6"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "io-util", "time"] }
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
default = []
