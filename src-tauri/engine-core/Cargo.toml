[package]
name = "endstate-engine-core"
version = "0.1.0"
description = "Tauri-free engine command/stream/bridge logic shared by the Endstate GUI app and the standalone dev bridge."
edition = "2021"
publish = false

[lib]
name = "endstate_engine_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "io-util", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
# Bridge-only deps: gated so the app crate (which links engine-core WITHOUT the
# `bridge` feature) does not pull axum/tower-http/tokio-stream into release.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

[features]
default = []
# Compiles the axum HTTP bridge module. Enabled only by endstate-dev-bridge.
bridge = ["axum", "tower-http", "tokio-stream"]

# Test-only: exercise the bridge router (body-limit regression). Only used when
# tests run with `--features bridge`; harmless otherwise.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
