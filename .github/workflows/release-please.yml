# Engine version is pinned via ENGINE_VERSION file at repo root.
# To ship a new engine version with the next GUI release:
#   1. Verify the engine tag exists: gh release list --repo Artexis10/endstate
#   2. Update ENGINE_VERSION to the desired semver (e.g. 1.8.0)
#   3. Commit, PR, merge. Next release-please PR will build against that engine.
# Do not leave ENGINE_VERSION blank or set to 'main' — builds must be reproducible.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to build and attach assets to (e.g. gui-v1.5.1)'
        required: true

permissions:
  contents: write
  pull-requests: write
  # Needed by the dispatch-ci job below to call `gh workflow run`.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # If a release was created, also update tauri.conf.json and Cargo.toml
      # (release-please only handles package.json for node type)
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: main

      - name: Sync version to Tauri files
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VERSION="${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"

          # Update tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

          # Update Cargo.toml version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

          # Commit if changes were made
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src-tauri/tauri.conf.json src-tauri/Cargo.toml
            git commit -m "chore: sync version $VERSION to Tauri files"
            git push
          fi

  # release-please-action opens its release PRs using GITHUB_TOKEN. Per
  # GitHub's recursion-protection rule, GITHUB_TOKEN-triggered events do NOT
  # fire other workflows (with `workflow_dispatch` and `repository_dispatch`
  # as the documented exceptions). That means the `pull_request` triggers on
  # ci.yml / verify-engine-pin.yml silently never fire on release-please PRs
  # — branch protection then blocks the merge waiting for checks that will
  # never arrive. This job closes the gap by explicitly dispatching ci.yml
  # against every open release-please PR's branch.
  dispatch-ci:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch CI against each open release-please PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCHES=$(gh pr list \
            --repo "${{ github.repository }}" \
            --search "head:release-please" \
            --state open \
            --json headRefName \
            --jq '.[].headRefName')
          if [ -z "$BRANCHES" ]; then
            echo "No open release-please PRs — nothing to dispatch."
            exit 0
          fi
          while IFS= read -r BRANCH; do
            [ -z "$BRANCH" ] && continue
            echo "Dispatching ci.yml against $BRANCH"
            gh workflow run ci.yml \
              --repo "${{ github.repository }}" \
              --ref "$BRANCH"
          done <<< "$BRANCHES"

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read ENGINE_VERSION
        id: read_engine_ver
        shell: bash
        run: |
          VERSION=$(cat ENGINE_VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Engine version: ${VERSION}" | tee -a $GITHUB_STEP_SUMMARY

      - name: Verify engine release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.read_engine_ver.outputs.version }}"
          echo "Checking release v${VERSION} on Artexis10/endstate..."
          if ! gh release view "v${VERSION}" --repo Artexis10/endstate > /dev/null 2>&1; then
            echo "::error::GitHub Release v${VERSION} does not exist on Artexis10/endstate."
            echo "Check available releases with: gh release list --repo Artexis10/endstate"
            exit 1
          fi
          echo "Release v${VERSION} confirmed." | tee -a $GITHUB_STEP_SUMMARY

      - name: Download engine binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.read_engine_ver.outputs.version }}"
          gh release download "v${VERSION}" \
            --repo Artexis10/endstate \
            --pattern "endstate.exe" \
            --pattern "endstate.exe.sha256"
          echo "Downloaded endstate.exe and endstate.exe.sha256 from v${VERSION}"

      - name: Verify engine checksum
        shell: pwsh
        run: |
          $expectedLine = (Get-Content endstate.exe.sha256 -Raw).Trim()
          # Handle both "<hash>" and "<hash>  <filename>" formats
          $expectedHash = ($expectedLine -split '\s+')[0].ToUpper()
          $actualHash = (Get-FileHash endstate.exe -Algorithm SHA256).Hash.ToUpper()
          if ($expectedHash -ne $actualHash) {
            Write-Error "Checksum mismatch for endstate.exe:`n  Expected: $expectedHash`n  Actual:   $actualHash"
            exit 1
          }
          Write-Host "Checksum verified: $actualHash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "SHA-256 verified: ``$actualHash``"

      - name: Place engine binary at sidecar location
        shell: bash
        run: |
          VERSION="${{ steps.read_engine_ver.outputs.version }}"
          mkdir -p src-tauri/binaries src-tauri/target/release
          cp endstate.exe src-tauri/binaries/endstate-x86_64-pc-windows-msvc.exe
          cp endstate.exe src-tauri/target/release/endstate.exe
          echo "Placed endstate v${VERSION} at sidecar locations." | tee -a $GITHUB_STEP_SUMMARY

      # Shallow checkout of the engine repo at the pinned version to obtain
      # resource files (modules/, VERSION, SCHEMA_VERSION) bundled in the installer.
      # No build occurs here — the binary was downloaded above.
      # TODO: remove once the engine release publishes a modules asset directly.
      - uses: actions/checkout@v4
        with:
          repository: Artexis10/endstate
          ref: v${{ steps.read_engine_ver.outputs.version }}
          path: endstate
          fetch-depth: 1
          token: ${{ secrets.ENGINE_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      # payload/ is gitignored (user-specific captured config); create the
      # minimum structure so the Tauri resource glob resolves in CI.
      - name: Create empty payload directory
        shell: bash
        run: mkdir -p endstate/payload/apps

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      # Build, sign, and upload via the first-party Tauri action. Signing env
      # vars are read natively by the Tauri CLI (contract, not an action detail).
      # The prebuild script (rebuild-engine.cjs) auto-detects the pre-placed
      # binary in src-tauri/binaries/ and skips the Go build automatically.
      - name: Build, sign, and upload Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag_name }}

      - name: Verify latest.json uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag_name }}
        run: |
          ASSETS=$(gh release view "$TAG" --repo Artexis10/endstate-gui --json assets --jq '[.assets[].name] | join(" ")')
          if ! echo "$ASSETS" | grep -qF "latest.json"; then
            echo "::error::Release $TAG is missing latest.json — updater endpoint will be broken." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "latest.json confirmed in release $TAG." | tee -a "$GITHUB_STEP_SUMMARY"
