name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to build and attach assets to (e.g. gui-v1.5.1)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # If a release was created, also update tauri.conf.json and Cargo.toml
      # (release-please only handles package.json for node type)
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: main

      - name: Sync version to Tauri files
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VERSION="${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"

          # Update tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

          # Update Cargo.toml version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

          # Commit if changes were made
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src-tauri/tauri.conf.json src-tauri/Cargo.toml
            git commit -m "chore: sync version $VERSION to Tauri files"
            git push
          fi

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: Artexis10/endstate
          path: endstate
          token: ${{ secrets.ENGINE_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      # tauri.conf.json references ../../endstate/ relative to src-tauri/
      # (i.e. ../endstate from workspace root). actions/checkout can't write
      # outside the workspace, so create a junction after checkout.
      - name: Link engine repo to expected location
        shell: cmd
        run: mklink /J ..\endstate endstate

      # payload/ is gitignored (user-specific captured config); create the
      # minimum structure so the Tauri resource glob resolves in CI.
      - name: Create empty payload directory
        shell: bash
        run: mkdir -p endstate/payload/apps

      - uses: actions/setup-go@v5
        with:
          go-version-file: endstate/go-engine/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Go engine with version ldflags
        shell: bash
        run: |
          VER=$(cat endstate/VERSION)
          SCHEMA_VER=$(cat endstate/SCHEMA_VERSION)
          LDFLAGS="-X github.com/Artexis10/endstate/go-engine/internal/config.version=${VER} -X github.com/Artexis10/endstate/go-engine/internal/config.schemaVersion=${SCHEMA_VER}"
          cd endstate/go-engine
          go build -ldflags "${LDFLAGS}" -o endstate.exe ./cmd/endstate/

      - name: Copy engine binary to sidecar locations
        shell: bash
        run: |
          cp endstate/go-engine/endstate.exe endstate/go-engine/endstate-x86_64-pc-windows-msvc.exe
          mkdir -p src-tauri/target/release
          cp endstate/go-engine/endstate.exe src-tauri/target/release/endstate.exe

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        shell: bash
        run: npm run tauri build
        env:
          SKIP_ENGINE_BUILD: '1'

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
