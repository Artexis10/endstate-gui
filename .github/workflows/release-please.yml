# Engine version is pinned via ENGINE_VERSION file at repo root.
# To ship a new engine version with the next GUI release:
#   1. Verify the engine tag exists: gh release list --repo Artexis10/endstate
#   2. Update ENGINE_VERSION to the desired semver (e.g. 1.8.0)
#   3. Commit, PR, merge. Next release-please PR will build against that engine.
# Do not leave ENGINE_VERSION blank or set to 'main' — builds must be reproducible.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to build and attach assets to (e.g. gui-v1.5.1)'
        required: true

# Release-please runs under the endstate-release-bot GitHub App identity
# (App ID + private key live as RELEASE_PLEASE_APP_* secrets). The minted
# installation token is a non-GITHUB_TOKEN credential, so the PRs and
# releases it creates fire `pull_request` events normally. Releases are created
# as drafts and published only after installers and updater assets pass the
# content and executable smoke gates below.
# This bypasses the recursion-protection rule that previously silently
# swallowed every cascade from this workflow. The earlier
# `dispatch-ci` shim job is no longer needed.

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint GitHub App installation token
        if: github.event_name == 'push'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      # Force tag creation prevents draft lazy-tag behavior from replaying
      # release history into a bogus PR. Manual rebuilds skip release automation.
      - name: Run release-please
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps the version STRING in tauri.conf.json, Cargo.toml,
      # package.json, ENGINE_VERSION, and (via a generic TOML updater in
      # release-please-config.json) the endstate-gui entry in Cargo.lock. That
      # string-substitution updater is fragile: it cannot regenerate the lock
      # and silently no-ops if the Cargo.lock layout shifts, which is how the
      # lock drifted behind Cargo.toml before (issue #72). The steps below run
      # REAL cargo against the freshly-bumped manifest on the Release PR branch
      # and push the corrected lockfile back, guaranteeing Cargo.lock's
      # endstate-gui version tracks Cargo.toml on every release. No post-merge
      # push to main is required.
      #
      # The push MUST use the App installation token, never GITHUB_TOKEN: a
      # GITHUB_TOKEN push to the PR branch is swallowed by the recursion-
      # protection rule and would NOT re-fire the Release PR's required checks,
      # leaving the PR stuck with stale/zero CI. Same token propagation the rest
      # of this repo relies on.
      - name: Check out Release PR branch to sync Cargo.lock
        if: github.event_name == 'push' && steps.release.outputs.pr
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Rust toolchain
        if: github.event_name == 'push' && steps.release.outputs.pr
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate and push Cargo.lock
        if: github.event_name == 'push' && steps.release.outputs.pr
        shell: bash
        env:
          HEAD_BRANCH: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail

          # Loop guard. This workflow only triggers on push to `main`; a push
          # to the Release PR branch does NOT retrigger it, so runaway recursion
          # is structurally impossible. This is a second belt: if the tip of the
          # branch is already our lockfile sync (e.g. a manual re-run before
          # release-please force-pushes the branch afresh), do nothing.
          if git log -1 --pretty=%s | grep -qF 'ci(release): sync Cargo.lock'; then
            echo "Cargo.lock already synced on ${HEAD_BRANCH} — skipping." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --workspace updates ONLY the workspace members (endstate-gui and
          # endstate-engine-core); the transitive registry deps are left
          # untouched, so the diff is just the bumped version string(s).
          cargo update --workspace --manifest-path src-tauri/Cargo.toml

          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already matches the bumped version — nothing to push." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  'endstate-release-bot[bot]'
          git config user.email 'endstate-release-bot[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git commit -m 'ci(release): sync Cargo.lock endstate-gui version'
          git push origin "HEAD:${HEAD_BRANCH}"
          echo "Synced src-tauri/Cargo.lock and pushed to ${HEAD_BRANCH}." \
            | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # The publish step below must NOT use GITHUB_TOKEN: GitHub suppresses
      # events triggered by it, so `release: released` never fires and
      # winget.yml goes silently dead (observed: no winget runs for
      # gui-v3.0.0 through gui-v3.2.1). The App token makes the cascade fire.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      # release-please creates automated releases as drafts. Re-runs and manual
      # dispatches enforce the same hold before touching assets, so failure can
      # never expose a partially rebuilt release or change /releases/latest.
      - name: Hold release as draft until installers are verified
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag_name }}
        run: gh release edit "$TAG" --repo Artexis10/endstate-gui --draft=true --prerelease=false --latest=false

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read ENGINE_VERSION
        id: read_engine_ver
        shell: bash
        run: |
          VERSION=$(cat ENGINE_VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Engine version: ${VERSION}" | tee -a $GITHUB_STEP_SUMMARY

      - name: Verify engine release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.read_engine_ver.outputs.version }}"
          echo "Checking release v${VERSION} on Artexis10/endstate..."
          if ! gh release view "v${VERSION}" --repo Artexis10/endstate > /dev/null 2>&1; then
            echo "::error::GitHub Release v${VERSION} does not exist on Artexis10/endstate."
            echo "Check available releases with: gh release list --repo Artexis10/endstate"
            exit 1
          fi
          echo "Release v${VERSION} confirmed." | tee -a $GITHUB_STEP_SUMMARY

      - name: Download engine binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.read_engine_ver.outputs.version }}"
          gh release download "v${VERSION}" \
            --repo Artexis10/endstate \
            --pattern "endstate.exe" \
            --pattern "endstate.exe.sha256"
          echo "Downloaded endstate.exe and endstate.exe.sha256 from v${VERSION}"

      - name: Verify engine checksum
        shell: pwsh
        run: |
          $expectedLine = (Get-Content endstate.exe.sha256 -Raw).Trim()
          # Handle both "<hash>" and "<hash>  <filename>" formats
          $expectedHash = ($expectedLine -split '\s+')[0].ToUpper()
          $actualHash = (Get-FileHash endstate.exe -Algorithm SHA256).Hash.ToUpper()
          if ($expectedHash -ne $actualHash) {
            Write-Error "Checksum mismatch for endstate.exe:`n  Expected: $expectedHash`n  Actual:   $actualHash"
            exit 1
          }
          Write-Host "Checksum verified: $actualHash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "SHA-256 verified: ``$actualHash``"

      - name: Place engine binary at sidecar location
        shell: bash
        run: |
          VERSION="${{ steps.read_engine_ver.outputs.version }}"
          mkdir -p src-tauri/binaries src-tauri/target/release
          cp endstate.exe src-tauri/binaries/endstate-x86_64-pc-windows-msvc.exe
          cp endstate.exe src-tauri/target/release/endstate.exe
          echo "Placed endstate v${VERSION} at sidecar locations." | tee -a $GITHUB_STEP_SUMMARY

      # Shallow checkout of the engine repo at the pinned version to obtain
      # resource files (modules/ and SCHEMA_VERSION) bundled in the installer.
      # No build occurs here — the binary was downloaded above.
      # TODO: remove once the engine release publishes a modules asset directly.
      - uses: actions/checkout@v4
        with:
          repository: Artexis10/endstate
          ref: v${{ steps.read_engine_ver.outputs.version }}
          path: endstate
          fetch-depth: 1
          token: ${{ secrets.ENGINE_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Test engine resource and release contracts
        run: npm run engine:test-resources

      - name: Stage and validate engine resources
        run: npm run engine:stage

      # Build, sign, and upload via the first-party Tauri action. Signing env
      # vars are read natively by the Tauri CLI (contract, not an action detail).
      # The prebuild script (rebuild-engine.cjs) auto-detects the pre-placed
      # binary in src-tauri/binaries/ and skips the Go build automatically.
      - name: Build, sign, and upload Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag_name }}
          # release-please creates this release as a draft. tauri-action must
          # match that state to find the existing release by tag and upload to it.
          releaseDraft: true

      - name: Audit MSI and NSIS contents
        shell: pwsh
        run: |
          $bundleRoot = 'src-tauri/target/release/bundle'
          $msi = @(Get-ChildItem $bundleRoot -Recurse -File -Filter '*.msi')
          $nsis = @(Get-ChildItem $bundleRoot -Recurse -File -Filter '*.exe')
          if ($msi.Count -eq 0 -or $nsis.Count -eq 0) {
            throw "Expected both MSI and NSIS installers under $bundleRoot."
          }
          foreach ($installer in @($msi + $nsis)) {
            npm run engine:audit-installer -- $installer.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Both formats are statically audited above. Execute the extracted NSIS
      # tree once because MSI and NSIS share the same staged catalog + sidecar.
      - name: Smoke packaged engine catalog
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -File -Filter '*.exe')
          if ($nsis.Count -eq 0) { throw 'NSIS installer not found for smoke test.' }
          npm run engine:smoke-installer -- $nsis[0].FullName

      - name: Verify installers + latest.json uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag_name }}
        run: |
          ASSETS=$(gh release view "$TAG" --repo Artexis10/endstate-gui --json assets --jq '[.assets[].name] | join(" ")')
          echo "Assets on $TAG: $ASSETS"
          missing=()
          echo "$ASSETS" | grep -qE '\.exe( |$)' || missing+=("a .exe installer")
          echo "$ASSETS" | grep -qE '\.msi( |$)' || missing+=("a .msi installer")
          echo "$ASSETS" | grep -qF "latest.json"  || missing+=("latest.json")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Release $TAG is missing: ${missing[*]} — would break /download and the auto-updater." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Verified installers + latest.json present in $TAG." | tee -a "$GITHUB_STEP_SUMMARY"

      # Publish every verified target, but only the tag matching main's current
      # package version may become Latest. Manual rebuilds of older tags stay
      # published and explicitly non-Latest.
      - name: Publish verified release
        shell: bash
        env:
          # App token, not GITHUB_TOKEN: this edit fires `release: released`,
          # which winget.yml consumes — GITHUB_TOKEN would suppress it.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag_name }}
        run: |
          EXPECTED_TAG="gui-v$(node -p "require('./package.json').version")"
          if [ "$TAG" = "$EXPECTED_TAG" ]; then
            gh release edit "$TAG" --repo Artexis10/endstate-gui --draft=false --prerelease=false --latest
            echo "Published $TAG as Latest." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh release edit "$TAG" --repo Artexis10/endstate-gui --draft=false --prerelease=false --latest=false
            echo "Published historical $TAG without changing Latest ($EXPECTED_TAG)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Backstop: if build, audit, smoke, or asset verification fails, keep the
      # target draft and non-Latest. /download and the updater continue serving
      # the previous verified release.
      - name: On failure, keep the release draft and out of Latest
        if: ${{ failure() || cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag_name }}
        run: |
          gh release edit "$TAG" --repo Artexis10/endstate-gui --draft=true --prerelease=false --latest=false || true
          echo "::error::Release $TAG did not produce verified installers and remains draft (NOT Latest). /download and the updater keep serving the previous good release. Investigate and re-run." \
            | tee -a "$GITHUB_STEP_SUMMARY"
