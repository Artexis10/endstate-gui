name: WinGet publication watch

# Fails loudly when WinGet publication stalls. The publish workflow has gone
# quiet twice: a release published with GITHUB_TOKEN never fired
# `release: released`, and an expired WINGET_TOKEN failed without notice.
# This daily check fails when the newest published GUI release is more than
# 3 days old and still missing from microsoft/winget-pkgs, or when
# WINGET_TOKEN is rejected, is not a classic token with the public_repo and
# workflow scopes, or expires within 14 days.

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-on-winget:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the newest release reached microsoft/winget-pkgs
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq \
            '[.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | startswith("gui-v")))][0] // empty | "\(.tag_name) \(.published_at)"')
          if [ -z "$latest" ]; then
            echo "::error::No published gui-v release found in $GITHUB_REPOSITORY."
            exit 1
          fi
          tag=${latest%% *}
          published=${latest#* }
          version=${tag#gui-v}
          age_days=$(( ($(date -u +%s) - $(date -u -d "$published" +%s)) / 86400 ))
          manifest_dir="repos/microsoft/winget-pkgs/contents/manifests/s/SubstrateSystems/Endstate/$version"
          if result=$(gh api "$manifest_dir" --silent 2>&1); then
            echo "Endstate $version is on WinGet."
          elif [[ "$result" != *"HTTP 404"* ]]; then
            echo "::error::Could not check microsoft/winget-pkgs for Endstate $version: $result"
            exit 1
          elif [ "$age_days" -gt 3 ]; then
            echo "::error::Endstate $version was released $age_days days ago and is still missing from microsoft/winget-pkgs. Check the 'Publish to WinGet' runs and the open winget-pkgs pull requests."
            exit 1
          else
            echo "Endstate $version is $age_days days old and not on WinGet yet; the 3-day window is still open."
          fi

  winget-token:
    runs-on: ubuntu-latest
    steps:
      # Mirrors the token checks in winget.yml without the fork sync, so this
      # daily run writes nothing. A token without write scopes still reads the
      # fork, and the publish then fails with 404 at merge-upstream.
      - name: Check WINGET_TOKEN can publish and is not about to expire
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          FORK: Artexis10/winget-pkgs
          FIX: "Replace the WINGET_TOKEN secret with a classic personal access token from the Artexis10 account that has the public_repo and workflow scopes."
        run: |
          set -euo pipefail
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::error::The WINGET_TOKEN secret is empty. $FIX"
            exit 1
          fi
          headers=$(mktemp)
          body=$(mktemp)
          # Only status codes, headers and response bodies are written; the token never is.
          github() {
            curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer $WINGET_TOKEN" \
              -H "Accept: application/vnd.github+json" "$@"
          }
          header() { grep -i "^$1:" "$headers" | cut -d: -f2- | tr -d '\r' | xargs || true; }

          status=$(github https://api.github.com/user)
          if [ "$status" != "200" ]; then
            echo "::error::GitHub rejected WINGET_TOKEN (HTTP $status). $FIX"
            exit 1
          fi
          login=$(jq -r .login "$body")
          if [ "$login" != "${FORK%%/*}" ]; then
            echo "::error::WINGET_TOKEN belongs to '$login', but the publish workflow uses $FORK. $FIX"
            exit 1
          fi
          if ! grep -qi '^x-oauth-scopes:' "$headers"; then
            echo "::error::WINGET_TOKEN is a fine-grained token; the WinGet action needs a classic token. $FIX"
            exit 1
          fi
          scopes=" $(header x-oauth-scopes | tr -d ',') "
          missing=""
          if [[ "$scopes" != *" public_repo "* && "$scopes" != *" repo "* ]]; then
            missing="public_repo"
          fi
          if [[ "$scopes" != *" workflow "* ]]; then
            missing="${missing:+$missing and }workflow"
          fi
          if [ -n "$missing" ]; then
            echo "::error::WINGET_TOKEN lacks the $missing scope (it has:${scopes% }), so the publish cannot sync $FORK. $FIX"
            exit 1
          fi
          expiry=$(header github-authentication-token-expiration)

          status=$(github "https://api.github.com/repos/$FORK")
          if [ "$status" != "200" ] || [ "$(jq -r .parent.full_name "$body")" != "microsoft/winget-pkgs" ]; then
            echo "::error::$FORK is missing or is not a fork of microsoft/winget-pkgs (HTTP $status). Fork microsoft/winget-pkgs to the Artexis10 account."
            exit 1
          fi

          if [ -z "$expiry" ]; then
            echo "WINGET_TOKEN can publish and has no expiry date."
            exit 0
          fi
          days_left=$(( ($(date -u -d "$expiry" +%s) - $(date -u +%s)) / 86400 ))
          if [ "$days_left" -lt 14 ]; then
            echo "::error::WINGET_TOKEN expires on $expiry, in $days_left days. $FIX"
            exit 1
          fi
          echo "WINGET_TOKEN can publish and expires on $expiry, in $days_left days."
