name: Release

on:
  push:
    tags:
      - 'gui-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#gui-v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          # Extract section between ## [x.y.z] and the next ## [ (or EOF)
          body=$(awk -v ver="$version" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$body" ]; then
            body="See CHANGELOG.md"
          fi

          # Write to file to avoid delimiter issues
          echo "$body" > /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GUI ${{ steps.version.outputs.version }}
          body_path: /tmp/release-body.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
