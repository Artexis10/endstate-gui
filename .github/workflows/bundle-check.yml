name: bundle-check

# Catch installer-bundle regressions BEFORE they merge.
#
# The release pipeline (release-please.yml) creates a draft GitHub Release when
# a release PR merges, then builds installers in a separate job. This PR gate
# catches broken resource staging, bundle contents, and packaged-engine catalog
# loading before that release build; the release remains draft if any backstop
# still fails.
#
# Every PR reports a stable bundle-gate result. A cheap Linux classifier starts
# the real Windows bundler only when bundle-sensitive files changed. Automated
# Release Please version PRs defer to the signed draft-release build after merge.
# The pre-merge build skips signing and publishing (MSI + NSIS, updater artifacts
# disabled); its goal is only to exercise resource bundling, not to ship anything.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-bundle:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.policy.outputs.required }}
      reason: ${{ steps.policy.outputs.reason }}

    steps:
      - uses: actions/checkout@v4

      - name: Collect pull-request paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          : > changed-files.txt
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --paginate --jq '.[].filename' > changed-files.txt
          fi

      - name: Classify bundle impact
        id: policy
        env:
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: node scripts/ci-bundle-policy.mjs < changed-files.txt >> "$GITHUB_OUTPUT"

      - name: Summarize decision
        env:
          REQUIRED: ${{ steps.policy.outputs.required }}
          REASON: ${{ steps.policy.outputs.reason }}
        run: echo "Windows bundle required=$REQUIRED — $REASON" >> "$GITHUB_STEP_SUMMARY"

  tauri-bundle:
    needs: classify-bundle
    if: needs.classify-bundle.outputs.required == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read ENGINE_VERSION
        id: read_engine_ver
        shell: bash
        run: echo "version=$(cat ENGINE_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Download engine binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.read_engine_ver.outputs.version }}"
          gh release download "v${VERSION}" --repo Artexis10/endstate --pattern "endstate.exe"

      - name: Place engine binary at sidecar location
        shell: bash
        run: |
          mkdir -p src-tauri/binaries src-tauri/target/release
          cp endstate.exe src-tauri/binaries/endstate-x86_64-pc-windows-msvc.exe
          cp endstate.exe src-tauri/target/release/endstate.exe

      # Shallow checkout of the engine repo at the pinned version to obtain the
      # resource files (modules/ and SCHEMA_VERSION) bundled into the installer.
      - uses: actions/checkout@v4
        with:
          repository: Artexis10/endstate
          ref: v${{ steps.read_engine_ver.outputs.version }}
          path: endstate
          fetch-depth: 1
          token: ${{ secrets.ENGINE_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Test engine resource and release contracts
        run: npm run engine:test-resources

      - name: Stage and validate engine resources
        run: npm run engine:stage

      # The real bundler — MSI + NSIS, updater artifacts off (no signing key
      # required). Both installer formats are audited below.
      - name: Tauri bundle check (no signing, no publish)
        shell: bash
        run: npm run tauri build -- --bundles msi,nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Audit MSI and NSIS contents
        shell: pwsh
        run: |
          $bundleRoot = 'src-tauri/target/release/bundle'
          $msi = @(Get-ChildItem $bundleRoot -Recurse -File -Filter '*.msi')
          $nsis = @(Get-ChildItem $bundleRoot -Recurse -File -Filter '*.exe')
          if ($msi.Count -eq 0 -or $nsis.Count -eq 0) {
            throw "Expected both MSI and NSIS installers under $bundleRoot."
          }
          foreach ($installer in @($msi + $nsis)) {
            npm run engine:audit-installer -- $installer.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Both formats are statically audited above. Execute the extracted NSIS
      # tree once because MSI and NSIS share the same staged catalog + sidecar.
      - name: Smoke packaged engine catalog
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -File -Filter '*.exe')
          if ($nsis.Count -eq 0) { throw 'NSIS installer not found for smoke test.' }
          npm run engine:smoke-installer -- $nsis[0].FullName

  bundle-gate:
    needs: [classify-bundle, tauri-bundle]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Enforce classified bundle result
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify-bundle.result }}
          BUNDLE_REQUIRED: ${{ needs.classify-bundle.outputs.required }}
          BUNDLE_RESULT: ${{ needs.tauri-bundle.result }}
        run: |
          set -euo pipefail

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::Bundle classification did not succeed: $CLASSIFY_RESULT"
            exit 1
          fi

          if [ "$BUNDLE_REQUIRED" = "true" ]; then
            if [ "$BUNDLE_RESULT" != "success" ]; then
              echo "::error::Windows bundle was required but finished as: $BUNDLE_RESULT"
              exit 1
            fi
            echo "Required Windows bundle audit passed."
          else
            if [ "$BUNDLE_RESULT" != "skipped" ]; then
              echo "::error::Windows bundle was not required but finished as: $BUNDLE_RESULT"
              exit 1
            fi
            echo "Windows bundle correctly skipped by policy."
          fi
