name: Engine Drift Check

# Detects when ENGINE_VERSION is behind the latest Artexis10/endstate release
# and opens a "feat:" PR to bump it. Runs daily and on demand.
# feat: title is required — release-please uses it to bump the GUI minor version on merge.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-drift:
    runs-on: ubuntu-latest

    steps:
      # Mint a GitHub App installation token (endstate-release-bot). Using
      # this for both the checkout and the create-pull-request step ensures
      # the bot PR's HEAD commit is authored by the App, which (unlike
      # GITHUB_TOKEN) does fire status-check workflows on the PR. Without
      # this, the bump PR opens with zero CI checks and stays stuck behind
      # the `verify-engine-pin` required check forever. Same pattern
      # release-please.yml uses.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      # -----------------------------------------------------------------------
      # 1. Read current pin + latest release, run semver comparison, guards
      # -----------------------------------------------------------------------
      - name: Detect drift
        id: detect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          CURRENT=$(cat ENGINE_VERSION | tr -d '[:space:]')
          LATEST=$(gh release view --repo Artexis10/endstate \
            --json tagName --jq '.tagName' | tr -d '[:space:]' | sed 's/^v//')

          echo "Current pin:    v${CURRENT}"
          echo "Latest release: v${LATEST}"
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT
          echo "latest=${LATEST}"   >> $GITHUB_OUTPUT

          # Semver comparison via inline Node.js — no npm install needed.
          # Handles 1.10.0 > 1.9.0 correctly (numeric, not lexicographic).
          IS_NEWER=$(CURRENT_VER="${CURRENT}" LATEST_VER="${LATEST}" node -e "
            const c = process.env.CURRENT_VER.split('.').map(Number);
            const l = process.env.LATEST_VER.split('.').map(Number);
            const gt = l[0]>c[0] || (l[0]===c[0]&&l[1]>c[1]) || (l[0]===c[0]&&l[1]===c[1]&&l[2]>c[2]);
            process.stdout.write(gt ? 'true' : 'false');
          ")

          if [ "$IS_NEWER" != "true" ]; then
            echo "No drift — ENGINE_VERSION is already at latest (v${CURRENT})." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "should_bump=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Idempotency: skip if a bump branch already exists for this version
          if git ls-remote --exit-code origin "refs/heads/bot/bump-engine-v${LATEST}" \
              >/dev/null 2>&1; then
            echo "Branch bot/bump-engine-v${LATEST} already exists — PR open, skipping." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "should_bump=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Guard: require both release assets before opening the bump PR.
          # A release without endstate.exe or .sha256 is incomplete; bumping
          # now would cause the GUI build to fail.
          ASSET_NAMES=$(gh release view "v${LATEST}" --repo Artexis10/endstate \
            --json assets --jq '[.assets[].name] | join(" ")')
          for REQUIRED in "endstate.exe" "endstate.exe.sha256"; do
            if ! echo "${ASSET_NAMES}" | grep -qF "${REQUIRED}"; then
              echo "WARNING: Release v${LATEST} is missing '${REQUIRED}' — skipping bump." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "should_bump=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "Drift confirmed: v${CURRENT} → v${LATEST}. Assets present." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "should_bump=true" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # 2. Build PR body (only when bump is needed)
      # -----------------------------------------------------------------------
      - name: Build PR body
        id: body
        if: steps.detect.outputs.should_bump == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CURRENT: ${{ steps.detect.outputs.current }}
          LATEST: ${{ steps.detect.outputs.latest }}
        shell: bash
        run: |
          MAJOR_CURRENT=$(echo "$CURRENT" | cut -d. -f1)
          MAJOR_LATEST=$(echo "$LATEST"  | cut -d. -f1)

          COMMITS=$(gh api "repos/Artexis10/endstate/compare/v${CURRENT}...v${LATEST}" \
            --jq '[.commits[].commit.message | split("\n")[0]] | "- " + join("\n- ")' \
            2>/dev/null || echo "_Unable to retrieve commit list._")

          {
            echo "content<<BODYEOF"
            if [ "$MAJOR_LATEST" -gt "$MAJOR_CURRENT" ]; then
              printf '## ⚠ Major version bump — review breaking changes before merging.\n\n'
            fi
            printf 'Bumps the bundled engine from `v%s` to [`v%s`](https://github.com/Artexis10/endstate/releases/tag/v%s).\n\n' \
              "$CURRENT" "$LATEST" "$LATEST"
            printf '### Engine commits since v%s\n\n' "$CURRENT"
            echo "$COMMITS"
            echo "BODYEOF"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 3. Write file changes (ENGINE_VERSION + README badge)
      # -----------------------------------------------------------------------
      - name: Update ENGINE_VERSION and README badge
        if: steps.detect.outputs.should_bump == 'true'
        env:
          LATEST: ${{ steps.detect.outputs.latest }}
        shell: bash
        run: |
          printf '%s' "$LATEST" > ENGINE_VERSION
          # Update the shields.io badge version in README.md
          sed -i "s|engine-v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*-blue|engine-v${LATEST}-blue|g" \
            README.md

      # -----------------------------------------------------------------------
      # 4. Open bump PR (peter-evans/create-pull-request handles idempotency
      #    at the action level too — updates existing PR on same branch)
      # -----------------------------------------------------------------------
      - name: Open bump PR
        if: steps.detect.outputs.should_bump == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/bump-engine-v${{ steps.detect.outputs.latest }}
          title: "feat: bump engine to v${{ steps.detect.outputs.latest }}"
          body: ${{ steps.body.outputs.content }}
          commit-message: "feat: bump engine to v${{ steps.detect.outputs.latest }}"
          delete-branch: true
