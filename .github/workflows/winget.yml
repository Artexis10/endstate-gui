name: Publish to WinGet

# Auto-submits each new Endstate release to microsoft/winget-pkgs so
# `winget install SubstrateSystems.Endstate` stays current. Fires only on
# full (non-prerelease) releases; workflow_dispatch allows re-submitting a
# specific version if a run fails.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.19.0); the gui-v<version> release must exist"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Derive version from tag or input
        id: version
        # Release tags look like "gui-v2.18.0" -> winget wants "2.18.0"
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#gui-v}" >> "$GITHUB_OUTPUT"
          fi

      # The publish action can only push through the Artexis10/winget-pkgs fork.
      # An expired or under-scoped WINGET_TOKEN once failed there quietly, so
      # check the token first and fail with the fix in the message.
      - name: Check WINGET_TOKEN can push to the winget-pkgs fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The WINGET_TOKEN secret is empty. Add a token that can push to Artexis10/winget-pkgs."
            exit 1
          fi
          if ! push=$(gh api repos/Artexis10/winget-pkgs --jq .permissions.push 2>&1); then
            echo "::error::GitHub rejected WINGET_TOKEN ($push). The token may have expired: replace the WINGET_TOKEN secret."
            exit 1
          fi
          if [ "$push" != "true" ]; then
            echo "::error::WINGET_TOKEN cannot push to Artexis10/winget-pkgs (permissions.push is '$push'). Replace the WINGET_TOKEN secret with a token that has push access to the fork."
            exit 1
          fi
          echo "WINGET_TOKEN can push to Artexis10/winget-pkgs."

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: SubstrateSystems.Endstate
          version: ${{ steps.version.outputs.value }}
          release-tag: gui-v${{ steps.version.outputs.value }}
          # Submit the MSI installer (matches the existing manifest)
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
