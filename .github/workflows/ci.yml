name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Kept for manual / ad-hoc runs. The GITHUB_TOKEN recursion-protection
  # workaround that originally motivated this trigger is no longer needed
  # (release-please.yml now mints its token from a GitHub App, so its PRs
  # fire `pull_request` events naturally).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test CI and release policies
        run: npm run test:ci-policy

      - name: Type-check and build web assets
        run: |
          npx tsc --noEmit
          npx vite build

      - name: Lint (enforce shadcn controls — no native interactive elements)
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # Exercise the GUI's machine-consumed contract against the exact released
  # engine pinned for bundling. This keeps additive capability consumption
  # honest without depending on a sibling source checkout in CI.
  engine-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download pinned engine
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ENGINE_VERSION)"
          gh release download "v${version}" \
            --repo Artexis10/endstate \
            --pattern endstate-linux-amd64 \
            --pattern endstate-linux-amd64.sha256

          expected="$(tr -d '[:space:]' < endstate-linux-amd64.sha256)"
          actual="$(sha256sum endstate-linux-amd64 | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Pinned engine checksum mismatch for v${version}"
            exit 1
          fi
          chmod +x endstate-linux-amd64

      - name: Run live engine contract tests
        env:
          ENDSTATE_ENGINE_PATH: ${{ github.workspace }}/endstate-linux-amd64
        run: npm run test:contract

      - name: Assert profile inspection golden is committed
        shell: bash
        run: |
          if ! git diff --quiet -- tests/fixtures/profile-inspect-envelope.golden.json; then
            echo "::error file=tests/fixtures/profile-inspect-envelope.golden.json::The real engine's profile inspection envelope no longer matches the committed golden fixture."
            git --no-pager diff -- tests/fixtures/profile-inspect-envelope.golden.json
            echo "Regenerate locally with: ENDSTATE_ENGINE_PATH=<pinned-engine> npm run test:contract"
            exit 1
          fi
          echo "Profile inspection golden matches the pinned engine."

  # A genuine install against a real package manager. Every other job either
  # mocks the engine or only exercises its error paths, so nothing else proves
  # that apply actually installs, that a dry run installs nothing, or that a
  # second run converges. Windows is the primary platform and the only one where
  # a real install is cheap enough to run per-PR.
  engine-real-apply:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download pinned engine
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ENGINE_VERSION)"
          gh release download "v${version}" \
            --repo Artexis10/endstate \
            --pattern endstate.exe \
            --pattern endstate.exe.sha256

          expected="$(tr -d '[:space:]' < endstate.exe.sha256)"
          actual="$(sha256sum endstate.exe | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Pinned engine checksum mismatch for v${version}"
            exit 1
          fi

      # jq: small, fast, no reboot, no installer UI, and absent from the runner
      # image. A heavier package would make this job the slowest in CI without
      # testing anything more.
      - name: Write a single-app profile
        shell: bash
        run: |
          mkdir -p ci-profile
          cat > ci-profile/manifest.jsonc <<'JSON'
          {
            "version": 1,
            "name": "ci-real-apply",
            "apps": [
              { "id": "jq", "refs": { "windows": "jqlang.jq" } }
            ]
          }
          JSON

      - name: Dry run installs nothing
        shell: bash
        run: |
          ./endstate.exe apply --profile ci-profile/manifest.jsonc --dry-run --json > dry.json
          node -e "
            const e = JSON.parse(require('fs').readFileSync('dry.json', 'utf8'));
            const d = e.data ?? {};
            if (!e.success) throw new Error('dry run failed: ' + JSON.stringify(e.error));
            if (d.dryRun !== true) throw new Error('expected dryRun=true, got ' + d.dryRun);
            if (d.summary.success !== 0) throw new Error('a dry run must install nothing, got success=' + d.summary.success);
            const a = d.actions.find(x => x.id === 'jq');
            if (a.status !== 'to_install') throw new Error('expected to_install, got ' + a.status);
            console.log('dry run: ' + a.status + ' / ' + a.reason);
          "

      - name: Real apply installs the package
        shell: bash
        run: |
          ./endstate.exe apply --profile ci-profile/manifest.jsonc --json > apply.json
          node -e "
            const e = JSON.parse(require('fs').readFileSync('apply.json', 'utf8'));
            const d = e.data ?? {};
            if (!e.success) throw new Error('apply failed: ' + JSON.stringify(e.error));
            if (d.dryRun !== false) throw new Error('expected dryRun=false, got ' + d.dryRun);
            if (d.summary.success !== 1) throw new Error('expected 1 install, got ' + d.summary.success);
            const a = d.actions.find(x => x.id === 'jq');
            if (a.status !== 'installed') throw new Error('expected installed, got ' + a.status);
            // to_install is dry-run-only; seeing it here means the run reported a
            // plan as if it were a result.
            if (d.actions.some(x => x.status === 'to_install')) throw new Error('to_install survived a real apply');
            console.log('apply: ' + a.status + ' v' + (a.version || '?'));
          "

      # winget must never prompt here: since engine 2.27.0 enumerates the
      # msstore source by default, a bare `winget list` on a fresh runner asks
      # for the msstore source agreement, dies on the non-interactive stdin
      # (0x8a150042), and reads as "package missing" — a verification-tool
      # failure masquerading as a dishonest install.
      - name: Package is actually present on the host
        shell: bash
        run: |
          winget list --id jqlang.jq --exact --accept-source-agreements --disable-interactivity | grep -q 'jqlang.jq' \
            || { echo '::error::engine reported installed but winget does not see the package'; exit 1; }

      - name: Re-apply converges instead of reinstalling
        shell: bash
        run: |
          ./endstate.exe apply --profile ci-profile/manifest.jsonc --json > again.json
          node -e "
            const e = JSON.parse(require('fs').readFileSync('again.json', 'utf8'));
            const d = e.data ?? {};
            if (d.summary.success !== 0) throw new Error('idempotent re-run must install nothing, got ' + d.summary.success);
            if (d.summary.skipped !== 1) throw new Error('expected 1 skipped, got ' + d.summary.skipped);
            const a = d.actions.find(x => x.id === 'jq');
            if (a.status !== 'present') throw new Error('expected present, got ' + a.status);
            console.log('re-apply: ' + a.status + ' / ' + a.reason);
          "

      # The apply payload assertions and golden-fixture regeneration live here
      # rather than in engine-contract: the fixture profile declares Windows
      # package refs, so only a Windows engine plans a populated actions[] for
      # it. On Linux the same run legitimately plans nothing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Unhappy path. Everything above proves the engine succeeds; this proves it
      # reports failure honestly, which is the half that lets a broken run render
      # as a successful one.
      - name: A package that cannot install is reported as failed
        shell: bash
        run: |
          mkdir -p ci-fail-profile
          cat > ci-fail-profile/manifest.jsonc <<'JSON'
          {
            "version": 1,
            "name": "ci-failure-case",
            "apps": [
              { "id": "bogus", "refs": { "windows": "This.Package.Does.Not.Exist.Endstate.CI" } }
            ]
          }
          JSON
          ./endstate.exe apply --profile ci-fail-profile/manifest.jsonc --json > fail.json || true
          node -e "
            const e = JSON.parse(require('fs').readFileSync('fail.json', 'utf8'));
            const d = e.data ?? {};
            const a = (d.actions ?? []).find(x => x.id === 'bogus');
            if (!a) throw new Error('no action reported for the unresolvable package');
            if (a.status !== 'failed') throw new Error('expected status failed, got ' + a.status);
            if (d.summary.failed !== 1) throw new Error('expected summary.failed=1, got ' + d.summary.failed);
            if (d.summary.success !== 0) throw new Error('expected summary.success=0, got ' + d.summary.success);
            // A per-item install failure is a partial failure: the command itself
            // ran fine, so envelope.success stays true. A consumer that reads
            // success as 'everything worked' would report a broken run as clean.
            if (e.success !== true) throw new Error('expected envelope success=true for a partial failure, got ' + e.success);
            if (!a.message) throw new Error('a failed action must carry a message explaining why');
            console.log('failure path: ' + a.status + ' / ' + a.reason + ' — ' + a.message);
          "

      # The module catalog ships in the engine repo (modules/apps/), not inside
      # the binary. A bare downloaded endstate.exe resolves no catalog, so
      # restoreModulesAvailable comes back empty and the scoping assertions have
      # nothing to check. Check the engine out at the pinned version and point
      # ENDSTATE_ROOT at it.
      - name: Resolve pinned engine ref
        shell: bash
        run: echo "ENGINE_REF=v$(tr -d '[:space:]' < ENGINE_VERSION)" >> "$GITHUB_ENV"

      - name: Check out the pinned engine's module catalog
        uses: actions/checkout@v4
        with:
          repository: Artexis10/endstate
          ref: ${{ env.ENGINE_REF }}
          path: engine-src

      # Regenerates BOTH golden envelopes (apply and restore) and runs the
      # mixed partial-failure assertions, all against the real pinned engine.
      - name: Assert apply + restore payloads and regenerate golden envelopes
        shell: bash
        env:
          ENDSTATE_ENGINE_PATH: ${{ github.workspace }}/endstate.exe
          ENDSTATE_ROOT: ${{ github.workspace }}/engine-src
          ENDSTATE_CONTRACT_PAYLOAD: '1'
        run: npm run test:contract

      # A diff means the engine's envelope changed and the E2E mock (asserted
      # against this fixture by src/e2e/mock-engine.conformance.test.ts) no
      # longer stands in for it. Failing here is the point — it is the only
      # signal that the mock and the producer have diverged.
      - name: Assert golden apply envelope is committed
        shell: bash
        run: |
          if ! git diff --quiet -- tests/fixtures/apply-envelope.golden.json; then
            echo "::error file=tests/fixtures/apply-envelope.golden.json::The real engine's apply envelope no longer matches the committed golden fixture."
            git --no-pager diff -- tests/fixtures/apply-envelope.golden.json
            echo "Regenerate locally with: ENDSTATE_CONTRACT_PAYLOAD=1 npm run test:contract"
            echo "Then update src/e2e/mock-engine.ts so the mock emits the new shape."
            exit 1
          fi
          echo "Golden apply envelope matches the pinned engine."

      # Same gate for the restore envelope. A diff means the real engine's
      # restore-enabled apply shape changed and the mock's restore-bearing
      # scenario (asserted against this fixture by
      # src/e2e/mock-engine.conformance.test.ts) no longer stands in for it.
      - name: Assert golden restore envelope is committed
        shell: bash
        run: |
          if ! git diff --quiet -- tests/fixtures/restore-envelope.golden.json; then
            echo "::error file=tests/fixtures/restore-envelope.golden.json::The real engine's restore envelope no longer matches the committed golden fixture."
            git --no-pager diff -- tests/fixtures/restore-envelope.golden.json
            echo "Regenerate locally with: ENDSTATE_CONTRACT_PAYLOAD=1 npm run test:contract"
            echo "Then update src/e2e/mock-engine.ts so the mock emits the new shape."
            exit 1
          fi
          echo "Golden restore envelope matches the pinned engine."

  # The GUI rendering the real engine's output — the half engine-real-apply
  # cannot see. engine-real-apply proves the engine's bytes; every browser test
  # otherwise runs against __ENDSTATE_MOCK_ENGINE__, so nothing proves the React
  # app reads a real envelope correctly. This job drives the real GUI in a
  # browser tab against the pinned engine through the standalone dev bridge (no
  # mock, no Tauri) and asserts the UI's own reading: that a dry-run apply is
  # disclosed as a preview rather than a completed install (#163), and that app
  # count / plan status / friendly name are rendered from summary + actions.
  #
  # Every apply this lane triggers is a dry run — nothing is installed, so it is
  # safe to run per-PR on a real Windows host. It fails loudly if the engine or
  # bridge is missing: the pre-flight step below runs the binary directly, and
  # the specs themselves boot the app against the bridge and error if it is down.
  gui-real-engine:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download pinned engine
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ENGINE_VERSION)"
          gh release download "v${version}" \
            --repo Artexis10/endstate \
            --pattern endstate.exe \
            --pattern endstate.exe.sha256

          expected="$(tr -d '[:space:]' < endstate.exe.sha256)"
          actual="$(sha256sum endstate.exe | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Pinned engine checksum mismatch for v${version}"
            exit 1
          fi

      # The module catalog ships in the engine repo (modules/apps/), not the
      # binary. The bridge points ENDSTATE_ROOT at this checkout so the engine
      # resolves the same catalog the bundled app ships with.
      - name: Resolve pinned engine ref
        shell: bash
        run: echo "ENGINE_REF=v$(tr -d '[:space:]' < ENGINE_VERSION)" >> "$GITHUB_ENV"

      - name: Check out the pinned engine's module catalog
        uses: actions/checkout@v4
        with:
          repository: Artexis10/endstate
          ref: ${{ env.ENGINE_REF }}
          path: engine-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Keeps the from-scratch dev-bridge compile (axum/tokio/tower) off the
      # critical path on warm runs. actions/cache is the repo's caching idiom.
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-dev-bridge-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-dev-bridge-${{ runner.os }}-

      - name: Build the standalone dev bridge
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml -p endstate-dev-bridge

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install chromium

      # Fail loudly and early if the pinned engine is missing or cannot run,
      # before Playwright starts anything. No silent skip.
      - name: Assert the pinned engine runs
        shell: bash
        env:
          ENDSTATE_ROOT: ${{ github.workspace }}/engine-src
        run: |
          test -f endstate.exe || { echo '::error::pinned engine binary missing'; exit 1; }
          ./endstate.exe capabilities --json > /dev/null \
            || { echo '::error::pinned engine failed to run capabilities'; exit 1; }

      # The config starts vite (VITE_BROWSER_BRIDGE=1) and the dev bridge; the
      # bridge resolves the engine from these two env vars. If either is wrong
      # the app's boot capabilities call fails and every spec fails.
      - name: Run GUI real-engine specs
        env:
          ENDSTATE_ENGINE_PATH: ${{ github.workspace }}/endstate.exe
          ENDSTATE_ROOT: ${{ github.workspace }}/engine-src
        run: npx playwright test -c playwright.real-engine.config.ts

      - name: Upload Playwright artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gui-real-engine-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Regression guard for the standalone dev bridge (PR #87). The dev bridge was
  # extracted out of the Tauri process specifically so it links NONE of the
  # native GUI stack (tao / wry / webview2-com) — that layer was the source of
  # the intermittent 0xc0000374 heap corruption (our Rust is zero-`unsafe`).
  # The fix holds only as long as nothing re-links that surface into the bridge
  # crate. This job runs the cheap shared-core tests, then fails the moment one
  # of those crates reappears in endstate-dev-bridge's dependency tree. The
  # dependency assertion is pure metadata resolved against Windows from Linux.
  dev-bridge-no-gui-deps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run shared-core Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p endstate-engine-core

      - name: Assert dev-bridge links no GUI crates
        working-directory: src-tauri
        run: |
          echo "Resolving endstate-dev-bridge dependency tree (x86_64-pc-windows-msvc)…"
          offenders=$(cargo tree --locked -p endstate-dev-bridge \
              --target x86_64-pc-windows-msvc --prefix none --no-dedupe \
            | sed -E 's/ \(.*\)//' | awk '{print $1}' | sort -u \
            | grep -xE 'tao|wry|webview2-com|webview2-com-sys|tauri|tauri-runtime|tauri-runtime-wry' || true)
          if [ -n "$offenders" ]; then
            echo "::error::endstate-dev-bridge now links native GUI crate(s) — reintroduces the 0xc0000374 crash surface:"
            echo "$offenders" | sed 's/^/  - /'
            echo "The dev bridge must stay free of tao/wry/webview2-com/tauri. See PR #87 and KB dev-bridge-crash-session-5-handoff."
            exit 1
          fi
          echo "OK — no tao/wry/webview2-com/tauri in the dev bridge."

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npx playwright test --reporter=list

      - name: Upload Playwright artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
