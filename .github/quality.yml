# Configuration for the engineering practices quality job (.github/workflows/ci.yml).
# Schema and behaviour: https://github.com/Artexis10/engineering-practices

# Proof weight. A file is product if it runs in a build, a deploy, an image, a
# scheduled job or a runtime import, or ships in a bundle; it is proof (fixtures,
# tests, tooling, scripts, specs) only if it never does. Proof is named by file or
# by a narrow glob, so a new file anywhere else counts as product. A file takes
# the first class whose pattern matches; `*` also matches `/`. Lockfiles: the
# action classes them as generated.
classes:
  fixtures:
    # Only the fixtures nothing ships. src/e2e/mock-engine.ts imports
    # e2e/fixtures/capture_ok_realistic.events.jsonl and profile_inspect.fixture.json,
    # so those two ship in the production bundle and count as product.
    - "e2e/fixtures/capture_captured.events.jsonl"
    - "e2e/fixtures/capture_v2_bundle.fixture.json"
    # The contract test's golden envelopes and input profiles.
    - "tests/fixtures/*.golden.json"
    - "tests/fixtures/golden-profile/*"
    - "tests/fixtures/profile-inspect-profile/*"
    - "tests/fixtures/restore-profile/*"
  tests:
    - "*.test.ts"
    - "*.test.tsx"
    - "*.test.js"
    - "*.test.mjs"
    - "e2e/*.ts"
    - "src/test/localStorage-helpers.ts"
    - "src/test/micro-feedback-helpers.ts"
    - "src/test/tauri-bridge-mock.ts"
    - "src/test/test-utils.tsx"
    - "vitest.config.ts"
    - "vitest.setup.ts"
    - "playwright.config.ts"
    - "playwright.real-engine.config.ts"
  tooling:
    # The standalone dev bridge: its own crate, and the engine-core module behind
    # the "bridge" feature that only the dev bridge enables.
    - "src-tauri/dev-bridge/Cargo.toml"
    - "src-tauri/dev-bridge/src/main.rs"
    - "src-tauri/engine-core/src/bridge.rs"
    # Nothing imports it: the version-sync pre-push hook reads it and
    # scripts/bump-version.mjs rewrites it.
    - "src/lib/compat.ts"
    # CI that builds or publishes nothing.
    - ".github/quality.yml"
    - ".github/FUNDING.yml"
    - ".github/workflows/ci.yml"
    - ".github/workflows/bundle-check.yml"
    - ".github/workflows/verify-engine-pin.yml"
    - ".github/workflows/engine-drift-check.yml"
    # Agent commands and skills, lint, hooks and the local env template.
    - ".claude/commands/opsx/*.md"
    - ".claude/skills/*/SKILL.md"
    - ".gitignore"
    - ".env.example"
    - "lefthook.yml"
    - "eslint.config.js"
  # Version, dev bridge, screenshot and CI policy scripts.
  scripts:
    - "scripts/bump-version.mjs"
    - "scripts/check-version-sync.mjs"
    - "scripts/ci-bundle-policy.mjs"
    - "scripts/refresh-engine.mjs"
    - "scripts/run-dev-bridge.cjs"
    - "scripts/capture-screenshots.mjs"
    - "scripts/capture-extras.mjs"
    - "scripts/record-demo.mjs"
    - "scripts/openspec_validate.ps1"
  specs: ["openspec/*.md", "openspec/*.yaml"]
  docs: ["*.md", "docs/*", "screenshots/*", "LICENSE"]
  product:
    # Includes src/e2e/ (the mock engine) and src/screenshots-harness.tsx:
    # src/main.tsx imports both, so they ship in the production bundle.
    - "src/*"
    - "e2e/fixtures/capture_ok_realistic.events.jsonl"
    - "e2e/fixtures/profile_inspect.fixture.json"
    - "src-tauri/*.rs"
    - "src-tauri/*.toml"
    - "src-tauri/*.json"
    - "src-tauri/icons/*"
    - "src-tauri/windows/*"
    - "src-tauri/binaries/*"
    - "assets/*"
    - "patches/*"
    - "index.html"
    - "package.json"
    - "ENGINE_VERSION"
    - "vite.config.ts"
    - "tailwind.config.js"
    - "postcss.config.cjs"
    - "tsconfig*.json"
    # Run by the release build: the prebuild engine rebuild, resource staging, and
    # the installer audit and smoke test.
    - "scripts/rebuild-engine.cjs"
    - "scripts/engine-resources.mjs"
    - "scripts/audit-windows-installer.mjs"
    - "scripts/smoke-packaged-engine.mjs"
    # Build and publish releases; the bootstrap watch is a scheduled job that
    # dispatches the WinGet publish.
    - ".github/workflows/release-please.yml"
    - ".github/workflows/winget.yml"
    - ".github/workflows/winget-bootstrap-watch.yml"
    - "release-please-config.json"
    - ".release-please-manifest.json"

# The dead-code gate. knip's Vite, Vitest, Playwright, Node test runner, Tauri and
# GitHub Actions plugins already find index.html's entry (src/main.tsx), the unit
# and e2e tests, both Playwright configs, tests/contract.test.js and the scripts
# that package.json and the workflows run. Tauri commands are Rust; the TypeScript
# `invoke()` callers are ordinary code.
javascript:
  knip:
    entry:
      # Screenshot and demo recorders, run by hand (`node scripts/<name>.mjs`).
      - "scripts/capture-screenshots.mjs"
      - "scripts/capture-extras.mjs"
      - "scripts/record-demo.mjs"
    ignore:
      # Not dead, though nothing imports it: scripts/check-version-sync.mjs (the
      # version-sync pre-push hook) reads it, scripts/bump-version.mjs rewrites it,
      # and openspec/specs/schema-version-compat requires it.
      - "src/lib/compat.ts"

# Exact token clones, on code only: OpenSpec deltas repeat requirement text by design.
duplicates:
  paths: ["src", "scripts", "e2e", "tests", "src-tauri/src", "src-tauri/engine-core", "src-tauri/dev-bridge"]

test_jobs:
  - test
  - engine-contract
  - engine-real-apply
  - gui-real-engine
  - dev-bridge-no-gui-deps
  - e2e
